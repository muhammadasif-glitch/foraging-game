<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food rooms</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="test-banner" hidden>Test mode: the files are marked TEST_</div>
  <div id="focus-note" hidden>The game does not have the keyboard: click on this page to go on.</div>
  <main>
    <section id="text-screen">
      <h1 id="text-title">Food rooms</h1>
      <div id="text-body"><p>Loading...</p></div>
      <input id="text-input" type="text" autocomplete="off" spellcheck="false" hidden>
      <p id="text-prompt" class="prompt"></p>
      <p id="text-status" class="status"></p>
    </section>
    <section id="game-screen" hidden>
      <div class="game-head">
        <span id="game-label"></span>
        <span id="steps-left"></span>
      </div>
      <div class="game-body">
        <div id="maze-box"><svg id="maze" role="img" aria-label="the maze"></svg></div>
        <aside id="panel">
          <div class="block">
            <div class="block-title">Energy</div>
            <div class="bar"><div id="energy-fill"></div></div>
            <div class="bar-text"><span id="energy-text"></span> <span id="gain"></span></div>
          </div>
          <div class="block" id="food-block" hidden>
            <div class="block-title">Food here</div>
            <div class="bar"><div id="food-fill"></div></div>
            <div class="bar-text" id="food-text"></div>
          </div>
          <div class="block keys">
            <div><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&rarr;</kbd> <kbd>&darr;</kbd> move</div>
            <div><kbd>Space</kbd> stay</div>
          </div>
        </aside>
      </div>
      <div id="game-message" hidden></div>
      <p id="game-prompt" class="prompt"></p>
    </section>
    <noscript><p>This game needs JavaScript.</p></noscript>
  </main>
  <script src="settings.js"></script>
  <script src="js/mazes.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/random.js"></script>
  <script src="js/config.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/datapipe.js"></script>
  <script src="js/view.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

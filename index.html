<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1016">
  <title>Food Rooms</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="stage">
    <canvas id="c3d" hidden></canvas>
    <canvas id="c2d" hidden></canvas>
  </div>

  <div id="hud" hidden>
    <div class="hud-item">
      <span class="hud-label">energy</span>
      <span class="bar"><i id="energyBar"></i></span>
      <span class="hud-value" id="energy"></span>
      <span id="gain"></span>
    </div>
    <div class="hud-item" id="hereItem" hidden>
      <span class="hud-label">food here</span>
      <span class="hud-value" id="here"></span>
      <span class="hud-label" id="worth"></span>
    </div>
    <div class="hud-item">
      <span class="hud-label">eaten</span>
      <span class="hud-value" id="eaten"></span>
    </div>
    <div class="hud-item" id="stepsItem">
      <span class="hud-label" id="stepsLabel">moves left</span>
      <span class="hud-value" id="steps"></span>
    </div>
  </div>
  <div id="gameKeys" hidden></div>

  <div id="menu" class="overlay" hidden>
    <div class="panel">
      <h1 id="title">Food Rooms</h1>
      <p class="sub" id="intro"></p>
      <div class="row-label" id="viewLabel">View</div>
      <div class="grid two" id="views"></div>
      <div class="row-label" id="mazeLabel">Maze</div>
      <div class="grid" id="mazes"></div>
      <p class="keys" id="menuKeys"></p>
      <button class="primary" id="play" tabindex="-1" disabled>Play &nbsp;<kbd>Enter</kbd></button>
      <p class="small" id="menuStatus"></p>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="panel">
      <h2 id="endTitle"></h2>
      <p class="score" id="endScore"></p>
      <p class="score-label" id="endLabel"></p>
      <div class="row-label" id="routeTitle"></div>
      <canvas id="route"></canvas>
      <p class="keys" id="endAgain"></p>
      <p class="small" id="endStatus"></p>
    </div>
  </div>

  <div id="message" class="overlay" hidden>
    <div class="panel">
      <h2 id="msgTitle">Food Rooms</h2>
      <p class="sub" id="msgBody">Loading...</p>
    </div>
  </div>

  <button id="soundBtn" class="sound" tabindex="-1" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg>
    <span>M</span>
  </button>

  <div id="test-banner" hidden>Test mode: the files are marked TEST_</div>
  <div id="focus-note" hidden>The game does not have the keyboard: click on this page to go on.</div>
  <noscript><p>This game needs JavaScript.</p></noscript>

  <script src="settings.js"></script>
  <script src="js/mazes.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/random.js"></script>
  <script src="js/config.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/datapipe.js"></script>
  <script src="js/world.js"></script>
  <script src="js/food.js"></script>
  <script src="js/paintings.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/route.js"></script>
  <script src="js/view2d.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
